version: "1.0.0"
name: "BMad Method Module"
description: "Core BMad Method implementation"
agents:
  - name: "Analyst"
    description: "Business analysis and research"
    commands:
      - "workflow-init"
      - "brainstorm-project"
      - "research"
      - "product-brief"
      - "document-project"
  - name: "PM"
    description: "Product requirements and planning"
    commands:
      - "create-prd"
      - "create-epics-and-stories"
      - "implementation-readiness"
      - "correct-course"
  - name: "Architect"
    description: "System architecture and technical design"
    commands:
      - "create-architecture"
      - "implementation-readiness"
      - "create-excalidraw-diagram"
      - "create-excalidraw-dataflow"
  - name: "SM"
    description: "Sprint planning and story preparation"
    commands:
      - "sprint-planning"
      - "create-story"
      - "validate-create-story"
      - "epic-retrospective"
      - "correct-course"
  - name: "DEV"
    description: "Story implementation and code review"
    commands:
      - "dev-story"
      - "code-review"
  - name: "Quick Flow Solo Dev"
    description: "Fast solo development without handoffs"
    commands:
      - "quick-spec"
      - "quick-dev"
      - "code-review"